name: FORCE Chat FAB Settings Top
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/FORCE_CHAT_FAB_SETTINGS_TOP.py'
      - '.github/workflows/FORCE-CHAT-FAB.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patches to app.tsx
        run: python3 scripts/FORCE_CHAT_FAB_SETTINGS_TOP.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/routes/app.tsx
          if git diff --cached --quiet; then echo "app.tsx unchanged"; exit 0; fi
          git commit -m "FORCE apply: Rex FAB in Private Chat, Settings scroll top, erase event"
          git push origin HEAD:main
