name: EMERGENCY Approval Preview
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/EMERGENCY-APPROVAL-PREVIEW.yml'
      - 'scripts/fix_approval_must_show_content.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_approval_must_show_content.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Safety: require message preview before Approve & Send" || exit 0
          git push origin HEAD:main
