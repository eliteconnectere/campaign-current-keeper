name: Fix chips crash oneshot
on:
  push:
    paths:
      - ".github/workflows/fix-chips-crash-oneshot.yml"
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-chips-crash.py
      - run: |
          if git diff --quiet; then echo No changes; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/routes/app.tsx
          git commit -m "fix: TemplateEditor chips crash (toneChips) + RexStudio optional prop"
          git push
