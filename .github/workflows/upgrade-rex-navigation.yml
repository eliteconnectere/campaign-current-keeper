name: Upgrade Rex navigation
on:
  push:
    paths:
      - ".github/workflows/upgrade-rex-navigation.yml"
      - "scripts/upgrade-rex-navigation.py"
      - "src/features/assist/navigation.registry.ts"
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/upgrade-rex-navigation.py
      - run: |
          if git diff --quiet; then echo No changes; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire expanded Rex navigation: tracker filters + broader intent + AI catalog"
          git push
