name: Wire Team Panel
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wire-team-panel.yml'
      - 'scripts/wire-team-panel.py'
      - 'src/features/team/**'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/wire-team-panel.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire ProMaxx Team seats panel into workspace menu" || exit 0
          git push origin HEAD:main
