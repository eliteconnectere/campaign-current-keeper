name: EMERGENCY Assistant First
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/EMERGENCY-ASSISTANT-FIRST.yml'
      - 'scripts/fix_rex_resume_and_draft_v2.py'
      - 'scripts/fix_rex_assistant_first_draft_send.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_rex_resume_and_draft_v2.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rex: assistant-first drafts, send-only approval, auto-resume campaign" || exit 0
          git push origin HEAD:main
