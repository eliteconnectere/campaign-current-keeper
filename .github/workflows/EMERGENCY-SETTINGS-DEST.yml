name: EMERGENCY Settings Destinations
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/EMERGENCY-SETTINGS-DEST.yml'
      - 'scripts/fix_settings_destinations_agent.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_settings_destinations_agent.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Agent: exact Settings destinations + navigate vs act rules" || exit 0
          git push origin HEAD:main
