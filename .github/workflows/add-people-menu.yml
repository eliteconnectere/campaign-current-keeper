name: Add People Menu
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-people-menu.yml'
      - 'scripts/add-people-menu.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/add-people-menu.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: show Add people in master menu" || exit 0
          git push origin HEAD:main
