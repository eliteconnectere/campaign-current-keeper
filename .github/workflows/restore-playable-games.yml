name: Restore Playable Games
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/playable/**'
      - '.github/workflows/restore-playable-games.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble games from base64 parts
        run: |
          python3 << 'END'
          import base64, pathlib
          def assemble(prefix, out):
            parts = sorted(pathlib.Path('scripts/playable').glob(prefix + '*'))
            if not parts:
              print('missing', prefix)
              return
            b64 = ''.join(p.read_text().strip() for p in parts)
            data = base64.b64decode(b64)
            pathlib.Path(out).parent.mkdir(parents=True, exist_ok=True)
            pathlib.Path(out).write_bytes(data)
            print(out, len(data))
          assemble('w', 'src/features/games/WhotGame.tsx')
          assemble('a', 'src/features/games/AyoGame.tsx')
          assemble('d', 'src/features/games/DraughtsGame.tsx')
          END
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/features/games/WhotGame.tsx src/features/games/AyoGame.tsx src/features/games/DraughtsGame.tsx
          git commit -m "Restore fully playable Whot, Ayo, Draughts engines" || exit 0
          git push origin HEAD:main
