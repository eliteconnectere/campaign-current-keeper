name: Wire Team Panel V2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wire-team-v2.yml'
      - 'scripts/wire-team-panel-v2.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/wire-team-panel-v2.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: show Add people in menu (Premium, ProMaxx, company master)" || exit 0
          git push origin HEAD:main
