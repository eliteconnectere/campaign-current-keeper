name: Wire Elite Radar Hub
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wire-radar-hub.yml'
      - 'scripts/wire-radar.py'
      - 'src/features/radar/EliteRadarHub.tsx'
jobs:
  wire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Wire radar into app.tsx
        run: python3 scripts/wire-radar.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "Replace Games with Elite Radar Hub" || exit 0
          git push origin HEAD:main
