name: Restore Workspace Menu
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/restore-workspace-menu.py'
      - '.github/workflows/restore-workspace-menu.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/restore-workspace-menu.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/routes/app.tsx
          git commit -m "fix: clean hamburger root + Settings panel (no duplicate Hotspot)" || exit 0
          git push origin HEAD:main
