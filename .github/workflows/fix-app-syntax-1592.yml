name: Fix App Syntax 1592
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fix-app-syntax-1592.py'
      - '.github/workflows/fix-app-syntax-1592.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-app-syntax-1592.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/routes/app.tsx
          git commit -m "fix: remove duplicate /> so Vercel build succeeds" || exit 0
          git push origin HEAD:main
