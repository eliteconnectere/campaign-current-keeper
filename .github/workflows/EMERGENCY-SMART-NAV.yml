name: EMERGENCY Smart Nav Search
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/EMERGENCY-SMART-NAV.yml'
      - 'scripts/fix_rex_smart_search_nav.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_rex_smart_search_nav.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rex: notification center vs dashboard + smart catalog search" || exit 0
          git push origin HEAD:main
