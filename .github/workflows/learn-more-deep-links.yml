name: Learn More Deep Links
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/learn-more-deep-links.yml'
      - 'scripts/learn-more-deep-links.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/learn-more-deep-links.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ux: Learn more opens exact guide section (#hash)" || exit 0
          git push origin HEAD:main
