name: EMERGENCY Phase3 Monitor
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/EMERGENCY-PHASE3-MONITOR.yml'
      - 'scripts/phase3_monitor_complete.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Phase3 monitor complete
        run: python3 scripts/phase3_monitor_complete.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Phase3 complete: Monitor offer, Studio controls, SYSTEM brief, route allowlist" || exit 0
          git push origin HEAD:main
