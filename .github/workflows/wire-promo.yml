name: Wire Promo Chip
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/wire-promo-chip.py'
      - '.github/workflows/wire-promo.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/wire-promo-chip.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: show November Promo chip in workspace" || exit 0
          git push origin HEAD:main
