name: Fix Delay From Send Start
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fix-delay-from-send-start.py'
      - '.github/workflows/fix-delay-from-send-start.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-delay-from-send-start.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/routes/app.tsx
          git commit -m "fix: delay timer starts at send start so 3s is not 3s+Gmail latency" || exit 0
          git push origin HEAD:main
