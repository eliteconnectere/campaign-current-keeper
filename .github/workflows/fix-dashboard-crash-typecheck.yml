name: Fix dashboard crash typecheck
on:
  push:
    paths:
      - ".github/workflows/fix-dashboard-crash-typecheck.yml"
      - "scripts/fix-dashboard-crash-typecheck.py"
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: python3 scripts/fix-dashboard-crash-typecheck.py
      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: dashboard TemplateEditor chips crash + typecheck guards"
          git push
