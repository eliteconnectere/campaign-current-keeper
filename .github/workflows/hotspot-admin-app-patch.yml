name: Hotspot Admin App Patch
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/hotspot-admin-app-patch.py'
      - '.github/workflows/hotspot-admin-app-patch.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/hotspot-admin-app-patch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/routes/app.tsx
          git commit -m "feat: Hotspot Access menu + Admin on floating crown" || exit 0
          git push origin HEAD:main
