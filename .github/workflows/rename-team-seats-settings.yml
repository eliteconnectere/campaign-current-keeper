name: Rename Team Seats
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/rename-team-seats-settings.py'
      - '.github/workflows/rename-team-seats-settings.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/rename-team-seats-settings.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "UI: Team seats → Assistants (keep add/share)" || exit 0
          git push origin HEAD:main
