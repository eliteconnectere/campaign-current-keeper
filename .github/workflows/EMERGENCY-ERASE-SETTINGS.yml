name: EMERGENCY Erase Under Settings
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/EMERGENCY-ERASE-SETTINGS.yml'
      - 'scripts/fix_erase_under_settings.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_erase_under_settings.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix: erase-data and clear-cache open Settings (not Reset workspace root)" || exit 0
          git push origin HEAD:main
