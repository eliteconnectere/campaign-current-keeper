name: EMERGENCY Restore PrivateChat
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore PrivateChat from last good commit and add Rex FAB
        run: |
          set -e
          git show 54ae078be5b4a25cc197bdcd7620b0e9fb952126:src/features/chat/PrivateChat.tsx > src/features/chat/PrivateChat.tsx
          python3 << 'PY'
          from pathlib import Path
          t = Path("src/features/chat/PrivateChat.tsx").read_text()
          old = '''export function PrivateChat({
            hub,
            prefs,
            onClose,
            onActiveChange,
            onUpgrade,
          }: {
            hub: ReturnType<typeof useChatHub>;
            prefs: ChatPrefs;
            onClose: () => void;
            onActiveChange: (cid: string | null) => void;
            onUpgrade: () => void;
          }) {'''
          new = '''export function PrivateChat({
            hub,
            prefs,
            onClose,
            onActiveChange,
            onUpgrade,
            onOpenRex,
          }: {
            hub: ReturnType<typeof useChatHub>;
            prefs: ChatPrefs;
            onClose: () => void;
            onActiveChange: (cid: string | null) => void;
            onUpgrade: () => void;
            onOpenRex?: () => void;
          }) {'''
          if old not in t:
              raise SystemExit("signature not found")
          t = t.replace(old, new, 1)
          marker = '''      ) : (
                  <Home hub={hub} onClose={onClose} onOpen={(cid, partner) => setActive({ cid, partner })} />
                )}
              </div>
            );
          }'''
          # normalize spaces - try flexible
          if "onOpenRex" not in t or "data-ec-rex-chat-fab" not in t:
              needle = "<Home hub={hub} onClose={onClose} onOpen={(cid, partner) => setActive({ cid, partner })} />"
              if needle not in t:
                  raise SystemExit("home needle missing")
              t = t.replace(
                  needle,
                  needle + '''
      {onOpenRex ? (
        <button type="button" data-ec-rex-chat-fab="" aria-label="Open Rex" onClick={onOpenRex}
          className="fixed bottom-24 right-4 z-[200] grid size-14 place-items-center rounded-full bg-brand text-white shadow-2xl ring-2 ring-white/40">
          <span className="text-lg font-bold leading-none">R</span>
        </button>
      ) : null}''',
                  1,
              )
          Path("src/features/chat/PrivateChat.tsx").write_text(t)
          print("patched", len(t))
          PY
      - name: Wire onOpenRex in app.tsx
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re
          p = Path("src/routes/app.tsx")
          t = p.read_text()
          # Remove forced settings tip
          t = t.replace('try { showPanelTip("settings"); } catch {}', "/* settings open: no forced tip */")
          # Scroll top on settings
          for m in list(re.finditer(r'setMenuView\("settings"\);', t))[::-1]:
              after = t[m.end():m.end()+80]
              if "scrollRexDestination" in after:
                  continue
              t = t[:m.start()] + 'setMenuView("settings"); try { window.setTimeout(() => scrollRexDestination(), 0); } catch {}' + t[m.end():]
          # Pass onOpenRex to PrivateChat if not present
          if "onOpenRex=" not in t and "<PrivateChat" in t:
              t = t.replace(
                  "<PrivateChat",
                  "<PrivateChat\n            onOpenRex={() => { setChatOpen(false); setAssistOpen(true); }}",
                  1,
              )
          p.write_text(t)
          print("app wired", "onOpenRex" in t)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/features/chat/PrivateChat.tsx src/routes/app.tsx
          git status
          git commit -m "EMERGENCY: restore PrivateChat + Rex FAB in chat + settings scroll top" || echo "nothing"
          git push origin HEAD:main
