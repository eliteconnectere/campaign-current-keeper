name: EMERGENCY Fix Gemini Model Turn
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/EMERGENCY-FIX-GEMINI-MODEL-TURN.yml'
      - 'scripts/fix_gemini_model_turn.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_gemini_model_turn.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Gemini HTTP 400: strip trailing model turns from contents" || exit 0
          git push origin HEAD:main
