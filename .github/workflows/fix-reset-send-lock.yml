name: Fix Reset Send Lock
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fix-reset-send-lock.py'
      - '.github/workflows/fix-reset-send-lock.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-reset-send-lock.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/routes/app.tsx
          git commit -m "fix: Reset clears send locks so new campaigns can run" || exit 0
          git push origin HEAD:main
