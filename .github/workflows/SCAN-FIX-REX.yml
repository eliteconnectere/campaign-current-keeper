name: SCAN FIX Rex Send Continue
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/SCAN_FIX_rex_send_continue.py'
      - '.github/workflows/SCAN-FIX-REX.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/SCAN_FIX_rex_send_continue.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo no changes; exit 0; fi
          git commit -m "Fix: never point to expired Approve; expand send/continue; direct pause/stop"
          git push origin HEAD:main
