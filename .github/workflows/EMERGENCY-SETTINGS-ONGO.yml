name: EMERGENCY Settings OnGo Force
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/EMERGENCY-SETTINGS-ONGO.yml'
      - 'scripts/fix_settings_ongo_force.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_settings_ongo_force.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Force onGo: Settings rows exact places including Erase Data" || exit 0
          git push origin HEAD:main
