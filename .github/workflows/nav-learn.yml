name: Nav Learn Support
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/nav-learn-engine-notes.py'
      - '.github/workflows/nav-learn.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/nav-learn-engine-notes.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: learn-more sharing, site nav groups, gmail tour event" || exit 0
          git push origin HEAD:main
