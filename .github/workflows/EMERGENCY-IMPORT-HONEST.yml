name: EMERGENCY Import Honest
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/EMERGENCY-IMPORT-HONEST.yml'
      - 'scripts/fix_import_error_honesty.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_import_error_honesty.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix: honest import failure reasons; document workspace authority" || exit 0
          git push origin HEAD:main
