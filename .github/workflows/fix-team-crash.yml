name: Fix Team CanManage Crash
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-team-crash.yml'
      - 'scripts/fix-team-can-manage-effect.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-team-can-manage-effect.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: move teamCanManage effect after signedIn (page load crash)" || exit 0
          git push origin HEAD:main
