name: EMERGENCY Send No Rewrite
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/EMERGENCY-SEND-NO-REWRITE.yml'
      - 'scripts/fix_send_no_rewrite.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_send_no_rewrite.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix: OK send never rewrites — agent pipeline only; fix \\b detector" || exit 0
          git push origin HEAD:main
