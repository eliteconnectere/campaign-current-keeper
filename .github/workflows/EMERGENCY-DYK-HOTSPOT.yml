name: EMERGENCY DYK Hotspot
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/EMERGENCY-DYK-HOTSPOT.yml'
      - 'scripts/fix_discovery_hotspot_expired.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_discovery_hotspot_expired.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "UX: expired approval notes, Did-you-know tips, hotspot share via Rex approval" || exit 0
          git push origin HEAD:main
