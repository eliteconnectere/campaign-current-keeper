name: Wire Expiry Snippets Share
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/wire-expiry-snippets-share.py'
      - '.github/workflows/wire-expiry-snippets.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/wire-expiry-snippets-share.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: on-screen expiry reminder, snippet categories, share_snippets control" || exit 0
          git push origin HEAD:main
