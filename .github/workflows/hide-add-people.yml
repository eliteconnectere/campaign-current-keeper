name: Hide Add People Non Owners
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hide-add-people.yml'
      - 'scripts/hide-add-people-free.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/hide-add-people-free.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: Add people menu only for paid owners (hide free + assistants)" || exit 0
          git push origin HEAD:main
