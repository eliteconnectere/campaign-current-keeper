name: Add Refresh Shortcut
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/add-refresh-shortcut.py'
      - '.github/workflows/add-refresh-shortcut.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/add-refresh-shortcut.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: Refresh on floating crown + promo visibility" || exit 0
          git push origin HEAD:main
