name: Assemble Games v3
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/gh-parts/**'
      - '.github/workflows/assemble-games-v3.yml'
jobs:
  a:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 << 'END'
          import base64, pathlib
          parts = sorted(pathlib.Path('scripts/gh-parts').glob('p*'))
          b64 = ''.join(p.read_text().strip() for p in parts)
          pathlib.Path('src/features/games').mkdir(parents=True, exist_ok=True)
          data = base64.b64decode(b64)
          pathlib.Path('src/features/games/GamesHub.tsx').write_bytes(data)
          print('restored', len(data))
          END
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/features/games/GamesHub.tsx
          git commit -m "restore full GamesHub vs CPU + Whot specials" || exit 0
          git push origin HEAD:main
