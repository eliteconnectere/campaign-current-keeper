name: Force Hide Risky Banner
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/force-hide-risky-banner.py'
      - '.github/workflows/force-hide-risky-banner.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/force-hide-risky-banner.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/routes/app.tsx
          git commit -m "UX: remove post-validate Open Vault / Send Standard banner" || exit 0
          git push origin HEAD:main
