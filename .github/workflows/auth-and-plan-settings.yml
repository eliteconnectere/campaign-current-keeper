name: Auth Redirect + Plan Settings
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/auth-redirect-and-plan-settings.py'
      - '.github/workflows/auth-and-plan-settings.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/auth-redirect-and-plan-settings.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx src/routes/privacy.tsx src/routes/terms.tsx src/routes/learn-more.tsx src/routes/app.tsx || true
          git commit -m "UX: logged-in users open /app; plan-gate Night Mode & Studio settings; back to workspace" || exit 0
          git push origin HEAD:main
