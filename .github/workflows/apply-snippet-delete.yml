name: Apply Snippet Delete and Campaign Toasts
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-snippet-delete.yml'
      - 'scripts/apply-snippet-delete.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply-snippet-delete.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: snippet delete/restore + clear campaign start error toasts" || exit 0
          git push origin HEAD:main
